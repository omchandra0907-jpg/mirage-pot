[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mirage-pot"
version = "0.1.0"
description = "Adaptive Deception Honeypot & Live Attack HUD"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Om chandra", email = "omchandra0907@gmail.com" }
]
dependencies = [
    "asyncssh>=2.14.0",
    "rich>=13.7.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.2.0",
]

[project.scripts]
mirage-pot = "mirage_pot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["mirage_pot"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
